name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Listings change slowly, so every three hours is plenty, and keeps "Today" right. Odd minutes
    # dodge the :00 rush, when GitHub most often drops scheduled runs.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub turns off scheduled workflows after 60 days without a commit, which would freeze the page.
  # If the repo has been quiet for 50 days, an empty commit resets that clock.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled build running"
            git push
          fi
